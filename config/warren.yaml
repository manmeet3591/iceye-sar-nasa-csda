# Bowling Green / Warren County, Kentucky flood-mapping testbed
name: warren
county_geoid: "21227"                      # Census GEOID, Warren County KY
bbox: [-86.674, 36.776, -86.114, 37.191]  # [west, south, east, north], WGS84
start: "2016-01-01"                        # Sentinel-1 OPERA RTC begins 2016

# Data sources in the calendar. coverage = fraction of the county imaged.
csda_collections:                          # commercial SAR via NASA CSDA (licensed)
  iceye: ICEYE (X-band)
  umbra: Umbra (X-band)
  capellaspace: Capella (X-band)
  airbus: Airbus SAR (X-band)
cmr_collections:                           # NASA Earthdata CMR (open)
  OPERA_L2_RTC-S1_V1: Sentinel-1 RTC (C-band, 30 m)
  NISAR_L2_GCOV_BETA_V1: NISAR GCOV beta (L-band)
  NISAR_L2_GCOV_PROVISIONAL_V1: NISAR GCOV provisional (L-band)
  NISAR_UR_L2: NISAR urgent response L2 (L-band)
  OPERA_L3_DSWX-S1_V1: OPERA DSWx-S1 water map
  OPERA_L3_DSWX-HLS_V1: OPERA DSWx-HLS water map (optical, clouds)
min_coverage: 0.2                          # ignore acquisitions covering < 20 % of the county
max_cloud_cover: 50                        # drop optical dates with more cloud (when known)

# USGS gauges with NWS flood categories (ft, gage height). From api.water.noaa.gov/nwps.
gauges:
  "03314500": {nws: BWGK2, name: Barren River at Bowling Green, action: 26, minor: 28, moderate: 32, major: 45}
  "03314000": {nws: ALVK2, name: Drakes Creek near Alvaton, action: 22, minor: 24, moderate: 35, major: 42}

match_window_days: 2       # an acquisition "sees" a flood if within this many days of it
groundsource_cluster_days: 3   # Groundsource reports this close together form one event

paths:
  groundsource: data/external/groundsource/groundsource_2026.parquet
  testbed: data/testbed/warren       # caches (boundary, raw query results)
  outputs: outputs/warren
  # keys below are required by the shared config loader
  manifest: data/manifest
  raw: data/raw
  processed: data/processed
  dem: data/dem

# Phase 1: Sentinel-1 water maps, DSWx-S1 comparison, gauge-based thresholding
phase1:
  grid_crs: EPSG:32616       # UTM 16N
  grid_res_m: 30             # native OPERA RTC / DSWx-S1 pixel size
  tracks:                    # relative orbit -> dates (UTC) and a dry reference date
    121:
      reference: "2025-01-24"
      dates: ["2025-01-24", "2025-02-05", "2025-02-17", "2025-03-01", "2025-03-13",
              "2025-03-25", "2025-04-06", "2025-04-18"]
    19:
      reference: "2025-01-29"
      dates: ["2025-01-17", "2025-01-29", "2025-02-10", "2025-02-22", "2025-03-06",
              "2025-03-18", "2025-03-30", "2025-04-11"]
  flood_dates: ["2025-02-17", "2025-04-06"]
  calibration_gauge: "03314500"   # Barren River at Bowling Green
  validation_gauge: "03314000"    # Drakes Creek near Alvaton (not used to calibrate)
  reach_radius_m: 1500            # area around a gauge where the water surface is ~flat
  reach_hand_max_m: 20            # ignore uplands inside that circle
  channel_occurrence: 50          # JRC occurrence % that marks the river channel
  thresholds_db: [-28.0, -8.0, 0.25]
  high_stage_ft: 20               # 'high-water' passes for the flood-only calibration
  tile_px: 96                     # automatic (tile) threshold: ~2.9 km tiles at 30 m

# Water-mask settings shared with config/kentucky.yaml
flood:
  hand_max_m: 15
  slope_max_deg: 5
  region_grow_db: 1.0
  permanent_water_occurrence: 80

# Phase 2: calibrate the cut-off on every high-water Sentinel-1 pass since 2016
phase2:
  store: /data1/iceye-testbed/warren   # large downloads live on the /data1 disk
  tracks: [19, 121]                    # track 26 has only 2 dates over the county
  min_stage_ft: 16                     # river level at the pass (either gauge)

# Phase 3: optical QA with OPERA DSWx-HLS
phase3:
  min_clear: 0.5            # use an optical scene only if >= 50 % of the Barren reach is cloud-free

# Phase 4: flooded forest - change from a dry pass on the same track
phase4:
  dry_max_ft: 9            # both gauges at or below this at the reference pass
  max_gap_days: 60         # reference within this many days of the flood pass (same leaf state)

# Phase 5: daily flood maps from the Barren River gauge + 1 m lidar
phase5:
  valid_km: 6               # agreement with Sentinel-1 holds within this distance of the gauge
