# Area of interest: Commonwealth of Kentucky (approximate bounding box, WGS84)
name: kentucky
bbox: [-89.58, 36.49, -81.96, 39.15]   # [west, south, east, north]

# Leave empty to get every date available.
# Example: temporal: ["2024-01-01T00:00:00Z", "2024-06-30T23:59:59Z"]
temporal: []

# ICEYE collection in the CSDA STAC catalog (https://csdap.earthdata.nasa.gov/stac)
stac:
  collection: iceye

# Product types to include. Empty list = every type found (GRD and SLC over Kentucky).
products: []

paths:
  manifest: data/manifest/kentucky_iceye_scenes.csv
  raw: data/raw
  processed: data/processed
  dem: data/dem
  outputs: outputs

flood:
  speckle_window: 5         # Lee filter window (pixels)
  target_resolution_m: 10   # geocoded pixel size
  water_threshold_db: null  # null = automatic Otsu threshold
  min_water_pixels: 50      # remove isolated water blobs smaller than this
  depth_smoothing_px: 15    # focal smoothing of water surface elevation
