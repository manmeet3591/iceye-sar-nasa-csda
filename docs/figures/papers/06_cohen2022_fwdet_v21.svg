<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2D42"/></marker></defs><rect x="0.0" y="0.0" width="1600.0" height="1000.0" rx="0" fill="#FCFAF5" stroke="none" stroke-width="2" opacity="1"/><rect x="48.0" y="30.0" width="479.0" height="27.0" rx="13.5" fill="#4C9BE8" stroke="none" stroke-width="2" opacity="1"/><text x="287.5" y="47.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Family B · Spread flood-edge elevation inward</text><text x="48.0" y="100.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#2B2D42" text-anchor="start">FwDET v2.1: clean the edge first</text><text x="48.0" y="134.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#6C7086" text-anchor="start">Cohen et al. (2022) · Remote Sensing 14(21), 5313</text><rect x="48.0" y="156.0" width="1504.0" height="70.0" rx="18" fill="#DCEBFB" stroke="#4C9BE8" stroke-width="2" opacity="1"/><text x="76.0" y="199.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#4C9BE8" text-anchor="start">Big idea:</text><text x="186.0" y="199.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2B2D42" text-anchor="start">Most depth errors come from bad edge cells — smooth them and drop the ones on steep slopes.</text><rect x="48.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="82.0" cy="288.0" r="20" fill="#4C9BE8" stroke="none" stroke-width="2"/><text x="82.0" y="295.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">1</text><text x="112.0" y="285.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2B2D42" text-anchor="start">The problem</text><g><line x1="93.0" y1="537.0" x2="361.0" y2="537.0" stroke="#6C7086" stroke-width="2" stroke-linecap="round"/><line x1="93.0" y1="357.0" x2="93.0" y2="537.0" stroke="#6C7086" stroke-width="2" stroke-linecap="round"/><text x="227.0" y="559.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6C7086" text-anchor="middle">position along flood edge</text><text x="83" y="447.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#6C7086" text-anchor="middle" transform="rotate(-90 83 447.0)">edge height</text><polyline points="93.0,447.0 102.2,496.6 111.5,434.2 120.7,400.7 130.0,471.7 139.2,510.9 148.4,412.0 157.7,416.1 166.9,490.0 176.2,466.8 185.4,370.1 194.7,439.6 203.9,497.0 213.1,441.6 222.4,398.4 231.6,475.7 240.9,491.0 250.1,417.7 259.3,410.6 268.6,485.7 277.8,489.3 287.1,401.5 296.3,432.3 305.6,496.3 314.8,449.0 324.0,367.3 333.3,457.8 342.5,494.0 351.8,424.1 361.0,405.9" fill="none" stroke="#E76F51" stroke-width="2.5" stroke-linejoin="round" opacity="1"/><text x="219.5" y="587.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#E76F51" text-anchor="middle">noisy edge → stripes in depth</text></g><text x="70.0" y="634.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">Flood map and DEM never match</text><text x="70.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">perfectly. Bad edge heights create</text><text x="70.0" y="678.2" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">stripes and spikes in depth.</text><path d="M397,493.0 L419,493.0 L419,484.0 L433,502.0 L419,520.0 L419,511.0 L397,511.0 Z" fill="#4C9BE8" opacity="0.85"/><rect x="437.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="471.0" cy="288.0" r="20" fill="#4C9BE8" stroke="none" stroke-width="2"/><text x="471.0" y="295.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">2</text><text x="501.0" y="285.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2B2D42" text-anchor="start">Smooth edge heights</text><g><line x1="482.0" y1="537.0" x2="750.0" y2="537.0" stroke="#6C7086" stroke-width="2" stroke-linecap="round"/><line x1="482.0" y1="357.0" x2="482.0" y2="537.0" stroke="#6C7086" stroke-width="2" stroke-linecap="round"/><text x="616.0" y="559.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6C7086" text-anchor="middle">position along flood edge</text><text x="472" y="447.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#6C7086" text-anchor="middle" transform="rotate(-90 472 447.0)">edge height</text><polyline points="482.0,447.0 491.2,496.6 500.5,434.2 509.7,400.7 519.0,471.7 528.2,486.9 537.4,412.0 546.7,416.1 555.9,490.0 565.2,466.8 574.4,398.9 583.7,439.6 592.9,497.0 602.1,441.6 611.4,398.4 620.6,465.0 629.9,491.0 639.1,417.7 648.3,410.6 657.6,485.7 666.8,473.5 676.1,401.5 685.3,432.3 694.6,496.3 703.8,449.0 713.0,397.2 722.3,457.8 731.5,494.0 740.8,424.1 750.0,405.9" fill="none" stroke="#B8B8B8" stroke-width="1.5" stroke-linejoin="round" opacity="1"/><polyline points="482.0,447.0 491.2,451.1 500.5,454.7 509.7,457.4 519.0,458.8 528.2,458.8 537.4,457.4 546.7,454.7 555.9,451.0 565.2,446.9 574.4,442.8 583.7,439.2 592.9,436.