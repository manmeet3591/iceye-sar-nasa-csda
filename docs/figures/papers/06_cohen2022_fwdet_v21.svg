y="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">probably misplaced; remove them.</text><path d="M1175,493.0 L1197,493.0 L1197,484.0 L1211,502.0 L1197,520.0 L1197,511.0 L1175,511.0 Z" fill="#4C9BE8" opacity="0.85"/><rect x="1215.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="1249.0" cy="288.0" r="20" fill="#4C9BE8" stroke="none" stroke-width="2"/><text x="1249.0" y="295.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">4</text><text x="1279.0" y="285.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2B2D42" text-anchor="start">Test 16 DEMs</text><g><line x1="1245.0" y1="537.0" x2="1528.0" y2="537.0" stroke="#6C7086" stroke-width="2" stroke-linecap="round"/><rect x="1262.0" y="411.0" width="60.4" height="126.0" rx="5" fill="#E76F51" stroke="none" stroke-width="2" opacity="1"/><text x="1292.2" y="403.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">9</text><text x="1292.2" y="557.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6C7086" text-anchor="middle">coarse DEM</text><rect x="1356.3" y="467.0" width="60.4" height="70.0" rx="5" fill="#E9C46A" stroke="none" stroke-width="2" opacity="1"/><text x="1386.5" y="459.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">5</text><text x="1386.5" y="557.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6C7086" text-anchor="middle">medium</text><rect x="1450.6" y="516.0" width="60.4" height="21.0" rx="5" fill="#2A9D8F" stroke="none" stroke-width="2" opacity="1"/><text x="1480.8" y="508.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">1.5</text><text x="1480.8" y="557.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6C7086" text-anchor="middle">10 m NED</text><text x="1386.5" y="592.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C7086" text-anchor="middle">sensitivity to settings (schematic)</text></g><text x="1237.0" y="634.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">Run in Google Earth Engine with 16</text><text x="1237.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">DEMs. Fine DEMs barely care about</text><text x="1237.0" y="678.2" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">the settings.</text><rect x="48.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#EEF2F7" stroke="none" stroke-width="2" opacity="1"/><text x="68.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#6C7086" text-anchor="start">NEEDS</text><text x="68.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Flood map + DEM (+ Google Earth Engine</text><text x="68.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">implementation).</text><rect x="429.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#EAF6EF" stroke="none" stroke-width="2" opacity="1"/><text x="449.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2A9D8F" text-anchor="start">GIVES</text><text x="449.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Cleaner depth maps with fewer</text><text x="449.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">artefacts.</text><rect x="810.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#DCEBFB" stroke="none" stroke-width="2" opacity="1"/><text x="830.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#4C9BE8" text-anchor="start">RESULT</text><text x="830.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Best: ~10 smoothing iterations + 0.5%</text><text x="830.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">slope threshold; 10 m NED far less</text><text x="830.0" y="878.8" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">sensitive than coarse DEMs.</text><rect x="1191.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#FDF3DC" stroke="none" stroke-width="2" opacity="1"/><text x="1211.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#B7791F" text-anchor="start">WATCH OUT</text><text x="1211.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Coarse global DEMs remain sensitive —</text><text x="1211.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">prefer USGS 3DEP lidar in the US.</text><text x="1552.0" y="986.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6C7086" text-anchor="end" font-style="italic">Bar heights in panel 4 are illustrative, not values from the paper.</text><text x="48.0" y="986.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6C7086" text-anchor="start">Schematic illustration · iceye-sar-nasa-csda teaching notes</text></svg>