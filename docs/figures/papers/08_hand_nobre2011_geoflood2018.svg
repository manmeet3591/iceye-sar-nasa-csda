iver stage h (e.g., National</text><text x="1237.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">Water Model discharge → rating</text><text x="1237.0" y="678.2" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">curve), cells with HAND &lt; h are</text><text x="1237.0" y="700.2" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">flooded.</text><rect x="48.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#EEF2F7" stroke="none" stroke-width="2" opacity="1"/><text x="68.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#6C7086" text-anchor="start">NEEDS</text><text x="68.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">DEM (+ river discharge/stage, or a SAR</text><text x="68.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">extent to calibrate h).</text><rect x="429.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#EAF6EF" stroke="none" stroke-width="2" opacity="1"/><text x="449.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2A9D8F" text-anchor="start">GIVES</text><text x="449.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Flood extent and depth everywhere along</text><text x="449.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">the network, very fast.</text><rect x="810.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#DDF2E6" stroke="none" stroke-width="2" opacity="1"/><text x="830.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#52B788" text-anchor="start">RESULT</text><text x="830.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Basis of GeoFlood (UT Austin) and</text><text x="830.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">NOAA&#x27;s NWM-HAND inundation mapping.</text><rect x="1191.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#FDF3DC" stroke="none" stroke-width="2" opacity="1"/><text x="1211.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#B7791F" text-anchor="start">WATCH OUT</text><text x="1211.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Ignores hydraulics (backwater, levees);</text><text x="1211.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">for SAR work best as a false-alarm</text><text x="1211.0" y="878.8" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">filter and cross-check.</text><text x="48.0" y="986.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6C7086" text-anchor="start">Schematic illustration · iceye-sar-nasa-csda teaching notes</text></svg>