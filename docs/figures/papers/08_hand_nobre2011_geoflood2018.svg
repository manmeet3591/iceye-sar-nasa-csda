he</text><text x="459.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">drainage network.</text><path d="M786,493.0 L808,493.0 L808,484.0 L822,502.0 L808,520.0 L808,511.0 L786,511.0 Z" fill="#52B788" opacity="0.85"/><rect x="826.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="860.0" cy="288.0" r="20" fill="#52B788" stroke="none" stroke-width="2"/><text x="860.0" y="295.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">3</text><text x="890.0" y="285.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2B2D42" text-anchor="start">Compute HAND</text><g><rect x="846.0" y="357.0" width="303.0" height="210.0" rx="10" fill="#F4F8FC" stroke="none" stroke-width="2" opacity="1"/><polygon points="846.0,367.5 906.6,430.5 961.1,514.5 988.4,556.5 1006.6,556.5 1033.9,508.2 1088.4,441.0 1149.0,382.2 1149.0,567.0 846.0,567.0" fill="#C9A47E" stroke="#8C6A4A" stroke-width="2" stroke-linejoin="round" opacity="1"/><circle cx="997.5" cy="552.5" r="6" fill="#2E6FA8" stroke="white" stroke-width="2"/><line x1="906.6" y1="430.5" x2="906.6" y2="556.5" stroke="#1B5E3B" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 3"/><line x1="898.6" y1="556.5" x2="914.6" y2="556.5" stroke="#1B5E3B" stroke-width="3" stroke-linecap="round"/><line x1="906.6" y1="556.5" x2="997.5" y2="556.5" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 4"/><rect x="882.6" y="478.5" width="48.0" height="20.0" rx="6" fill="white" stroke="none" stroke-width="2" opacity="0.9"/><text x="906.6" y="493.5" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1B5E3B" text-anchor="middle">HAND</text><line x1="1073.2" y1="459.7" x2="1073.2" y2="556.5" stroke="#1B5E3B" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 3"/><line x1="1065.2" y1="556.5" x2="1081.2" y2="556.5" stroke="#1B5E3B" stroke-width="3" stroke-linecap="round"/><line x1="1073.2" y1="556.5" x2="997.5" y2="556.5" stroke="#1B5E3B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 4"/><rect x="1049.2" y="493.1" width="48.0" height="20.0" rx="6" fill="white" stroke="none" stroke-width="2" opacity="0.9"/><text x="1073.2" y="508.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1B5E3B" text-anchor="middle">HAND</text><text x="997.5" y="592.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#52B788" text-anchor="middle">height above nearest stream</text></g><text x="848.0" y="634.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">For each cell: its height above the</text><text x="848.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">stream cell it drains to.</text><path d="M1175,493.0 L1197,493.0 L1197,484.0 L1211,502.0 L1197,520.0 L1197,511.0 L1175,511.0 Z" fill="#52B788" opacity="0.85"/><rect x="1215.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="1249.0" cy="288.0" r="20" fill="#52B788" stroke="none" stroke-width="2"/><text x="1249.0" y="295.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">4</text><text x="1279.0" y="285.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2B2D42" text-anchor="start">Flood to a stage</text><g><rect x="1235.0" y="357.0" width="303.0" height="210.0" rx="10" fill="#F4F8FC" stroke="no