<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2D42"/></marker></defs><rect x="0.0" y="0.0" width="1600.0" height="1000.0" rx="0" fill="#FCFAF5" stroke="none" stroke-width="2" opacity="1"/><rect x="48.0" y="30.0" width="438.2" height="27.0" rx="13.5" fill="#52B788" stroke="none" stroke-width="2" opacity="1"/><text x="267.1" y="47.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Family C · Height above the stream (HAND)</text><text x="48.0" y="100.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#2B2D42" text-anchor="start">HAND: Height Above Nearest Drainage</text><text x="48.0" y="134.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#6C7086" text-anchor="start">Nobre et al. (2011) → GeoFlood: Zheng, Maidment, Tarboton, Passalacqua et al. (2018) · Water Resources Research</text><rect x="48.0" y="156.0" width="1504.0" height="70.0" rx="18" fill="#DDF2E6" stroke="#52B788" stroke-width="2" opacity="1"/><text x="76.0" y="199.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#52B788" text-anchor="start">Big idea:</text><text x="186.0" y="199.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#2B2D42" text-anchor="start">Every cell&#x27;s height above its stream tells you how much water it takes to flood it.</text><rect x="48.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="82.0" cy="288.0" r="20" fill="#52B788" stroke="none" stroke-width="2"/><text x="82.0" y="295.0" font-family="Inter, 'De