y="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">edge, and very flat terrain make the</text><text x="1211.0" y="878.8" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">edge unreliable.</text><text x="48.0" y="986.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6C7086" text-anchor="start">Schematic illustration · iceye-sar-nasa-csda teaching notes</text></svg>