="800" fill="white" text-anchor="middle">TVD</text><rect x="487.0" y="507.0" width="243.0" height="52.0" rx="12" fill="#5DA9E9" stroke="none" stroke-width="2" opacity="0.9"/><text x="608.5" y="541.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">FwDET</text></g><text x="459.0" y="634.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">HAND (terrain only), TVD and FwDET</text><text x="459.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">(both edge-based).</text><path d="M786,493.0 L808,493.0 L808,484.0 L822,502.0 L808,520.0 L808,511.0 L786,511.0 Z" fill="#9D7CD8" opacity="0.85"/><rect x="826.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="860.0" cy="288.0" r="20" fill="#9D7CD8" stroke="none" stroke-width="2"/><text x="860.0" y="295.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">3</text><text x="890.0" y="285.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2B2D42" text-anchor="start">Score them</text><g><line x1="856.0" y1="537.0" x2="1139.0" y2="537.0" stroke="#6C7086" stroke-width="2" stroke-linecap="round"/><rect x="873.0" y="482.4" width="60.4" height="54.6" rx="5" fill="#5DA9E9" stroke="none" stroke-width="2" opacity="1"/><text x="903.2" y="474.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">0.78 m</text><text x="903.2" y="557.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6C7086" text-anchor="middle">FwDET</text><rect x="967.3" y="439.7" width="60.4" height="97.3" rx="5" fill="#E9C46A" stroke="none" stroke-width="2" opacity="1"/><text x="997.5" y="431.7" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">1.39 m</text><text x="997.5" y="557.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6C7086" text-anchor="middle">TVD</text><rect x="1061.6" y="414.5" width="60.4" height="122.5" rx="5" fill="#52B788" stroke="none" stroke-width="2" opacity="1"/><text x="1091.8" y="406.5" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B2D42" text-anchor="middle">1.75 m</text><text x="1091.8" y="557.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6C7086" text-anchor="middle">HAND</text><text x="997.5" y="592.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6C7086" text-anchor="middle">RMSE (lower is better)</text></g><text x="848.0" y="634.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">On validation sites FwDET had the</text><text x="848.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">lowest error.</text><path d="M1175,493.0 L1197,493.0 L1197,484.0 L1211,502.0 L1197,520.0 L1197,511.0 L1175,511.0 Z" fill="#9D7CD8" opacity="0.85"/><rect x="1215.0" y="252.0" width="343.0" height="500.0" rx="20" fill="white" stroke="#D9D4C7" stroke-width="2" opacity="1"/><circle cx="1249.0" cy="288.0" r="20" fill="#9D7CD8" stroke="none" stroke-width="2"/><text x="1249.0" y="295.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">4</text><text x="1279.0" y="285.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#2B2D42" text-anchor="start">Lessons</text><g><rect x="1245.0" y="357.0" width="283.0" height="210.0" rx="12" fill="#F7F3EA" stroke="none" stroke-width="2" opacity="1"/><text x="1263.0" y="392.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A9D8F" text-anchor="start">• FwDET most accurate</text><text x="1263.0" y="430.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A9D8F" text-anchor="start">• &amp; most robust to DEM</text><text x="1263.0" y="468.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E76F51" text-anchor="start">• FwDET under-estimates deep</text><text x="1263.0" y="506.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E76F51" text-anchor="start">• HAND/TVD over-estimate</text><text x="1263.0" y="544.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6C7086" text-anchor="start">• wide rivers hardest</text></g><text x="1237.0" y="634.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">Edge-based methods beat HAND alone;</text><text x="1237.0" y="656.1" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">every method struggles in wide</text><text x="1237.0" y="678.2" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#2B2D42" text-anchor="start">rivers.</text><rect x="48.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#EEF2F7" stroke="none" stroke-width="2" opacity="1"/><text x="68.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#6C7086" text-anchor="start">NEEDS</text><text x="68.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Flood extents + DEMs + hydraulic-model</text><text x="68.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">reference depths.</text><rect x="429.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#EAF6EF" stroke="none" stroke-width="2" opacity="1"/><text x="449.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2A9D8F" text-anchor="start">GIVES</text><text x="449.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">Independent ranking of depth methods.</text><rect x="810.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#ECE4F8" stroke="none" stroke-width="2" opacity="1"/><text x="830.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#9D7CD8" text-anchor="start">RESULT</text><text x="830.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">RMSE ≈ 0.78 m (FwDET), 1.39 m (TVD),</text><text x="830.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">1.75 m (HAND); all improve slightly for</text><text x="830.0" y="878.8" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">bigger floods.</text><rect x="1191.0" y="776.0" width="365.0" height="180.0" rx="16" fill="#FDF3DC" stroke="none" stroke-width="2" opacity="1"/><text x="1211.0" y="808.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#B7791F" text-anchor="start">WATCH OUT</text><text x="1211.0" y="836.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">RMSE values from the lead author&#x27;s</text><text x="1211.0" y="857.4" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">presentation slides — verify in the</text><text x="1211.0" y="878.8" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#2B2D42" text-anchor="start">paper before citing.</text><text x="48.0" y="986.0" font-family="Inter, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#6C7086" text-anchor="start">Schematic illustration · iceye-sar-nasa-csda teaching notes</text></svg>